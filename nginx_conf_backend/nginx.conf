server {
    listen 80;
    server_name nginx.siaploulis.com;

    root /var/www/html;
    index login.php register.php welcome.php logout.php index.html index;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Serve static files directly
    location ~* ^.+\.(jpg|jpeg|gif|css|png|js|ico|svg|html|txt)$ {
        access_log off;
        expires 30d;
    }

    #  Handles static files and default routing
    location / {
        try_files $uri $uri/ /login.php$is_args$query_string;
    }
    

    # Handles PHP files separately
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;  # Ensure this matches your PHP container/service name
        fastcgi_index login.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 3 Ensures security: Blocks access to hidden files
    location ~ /\. {
        deny all;
    }
}
