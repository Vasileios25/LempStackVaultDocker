services:
  vault:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: vault
    network_mode: host
    environment:
      VAULT_ADDR: 'https://vault.siaploulis.com:8200'
    volumes:
      - ./vault/config/vault-config.hcl:/vault/config/vault-config.hcl
      #-  ./apply-policies.sh:/vault/scripts/apply-policies.sh
      #-  ./init-vault.sh:/vault/scripts/init-vault.sh
      - ./vault/certs/fullchain.pem:/vault/certs/fullchain.pem
      - ./vault/certs/privkey.pem:/vault/certs/privkey.pem
      - ./kv-policy.hcl:/vault/policies/kv-policy.hcl


  mysql_source:
    container_name: source_sql
    build:
      context: .
      dockerfile: Dockerfile.master
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err}
      MYSQL_DATABASE: app
      MYSQL_SSL_MODE: REQUIRED
    volumes:
      - ./master/my.cnf:/etc/mysql/my.cnf
      - ./master/data:/var/lib/mysql
      - ./master/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./certs_sql/ca-cert.pem:/etc/mysql/certs/custom-ca.pem
      - ./certs_sql/server-cert.pem:/etc/mysql/certs/server-cert.pem
      - ./certs_sql/server-key.pem:/etc/mysql/certs/server-key.pem
      #- ./mysql-master-d:/var/lib/mysql/data  # Persistent volume for master data
      #-  /mysql-master-logs:/var/run/mysqld  # Persistent volume for master logs
    ports:
      - 3306:3306

    networks:
      - backend



  mysql_replica:
    container_name: replica_sql
    build:
      context: .
      dockerfile: Dockerfile.replica
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err}
      MYSQL_DATABASE: app
      MYSQL_SSL_MODE: REQUIRED
    volumes:
      - ./slave/my.cnf:/etc/mysql/my.cnf
      - ./slave/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./certs_sql/ca-cert.pem:/etc/mysql/certs/custom-ca.pem
      - ./certs_sql/client-cert.pem:/etc/mysql/certs/client-cert.pem
      - ./certs_sql/client-key.pem:/etc/mysql/certs/client-key.pem
      - ./mysql-replica-data:/var/lib/mysql  # Persistent volume for replica data

    ports:
      - 3307:3306
    networks:
      - backend

  php:
    build: 
      context: .
      dockerfile: Dockerfile.php
    container_name: php
    ports:
      - 9000:9000
    volumes:
      - ./html:/var/www/html
    networks:
      - backend

  web_server1:
    image:  nginx
    container_name: nginx_slave1
    volumes:
      - ./html/login.php:/var/www/html/login.php
      - ./html/db.php:/var/www/html/db.php
      - ./html/register.php:/var/www/html/register.php
      - ./html/welcome.php:/var/www/html/welcome.php
      - ./nginx_conf_backend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend
    depends_on:
      - php



  web_server2:
    image: nginx
    container_name: nginx_slave2
    volumes:
      - ./html/login.php:/var/www/html/login.php
      - ./html/db.php:/var/www/html/db.php
      - ./html/register.php:/var/www/html/register.php
      - ./html/welcome.php:/var/www/html/welcome.php
      - ./nginx_conf_backend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend
    depends_on:
      - php



  load_balancer:
    build:
      context: .
      dockerfile: Dockerfile.nginx 
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf://etc/nginx/conf.d/default.conf
      - ./certs_nginx/fullchain.pem:/etc/letsencrypt/fullchain.pem
      - ./certs_nginx/privkey.pem:/etc/letsencrypt/privkey.pem
    networks:
      frontend:
        ipv4_address: 192.168.100.7
      backend:
    depends_on:
      - web_server1
      - web_server2
    
networks:
  backend:
  frontend:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 192.168.100.0/24
